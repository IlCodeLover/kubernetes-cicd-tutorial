name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      # Convert repository name to lowercase in image tag in order to prevent GHCR uppercase errors
      - name: Lowercase Repository Name
        id: repo_case
        run: echo "repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_case.outputs.repo }}:latest
            ghcr.io/${{ steps.repo_case.outputs.repo }}:${{ github.sha }}
      - name: Update GitOps repository
        shell: bash
        env:
          GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
          LOWER_REPO: ${{ steps.repo_case.outputs.repo }}
        run: |
          # Configure git credential store
          git config --global credential.helper store
          echo "https://${GIT_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials
          
          # Remove any existing gitops directory
          rm -rf gitops
          
          # Clone repository using HTTPS URL without token
          git clone https://github.com/IlCodeLover/grade-api-gitops.git gitops
          cd gitops

          echo "---> Before changing script <------"
          cat deployment.yaml
               
          # Image names in GHCR are lowercase. Therefore we search image tag in lowercase and when it is found, we add suffix sha so every image tag is unique
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s|image: ghcr.io/${LOWER_REPO}:.*|image: ghcr.io/${LOWER_REPO}:${{ github.sha }}|g" deployment.yaml
          else
            sed -i "s|image: ghcr.io/${LOWER_REPO}:.*|image: ghcr.io/${LOWER_REPO}:${{ github.sha }}|g" deployment.yaml
          fi

          echo "---> After changing script <------"
          cat deployment.yaml

          # Commit changes
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deployment.yaml
          if git diff --cached --quiet; then
            echo "No image change, skipping commit"
          else
            git commit -m "Update image to ${{ github.sha }}"
            # Push
            git push -f https://${GIT_TOKEN}@github.com/IlCodeLover/grade-api-gitops.git main
          fi
