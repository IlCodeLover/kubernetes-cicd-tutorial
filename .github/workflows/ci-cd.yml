name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      # Convert repository name to lowercase to prevent GHCR uppercase errors
      - name: Lowercase Repository Name
        id: repo_case
        run: echo "repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_case.outputs.repo }}:latest
            ghcr.io/${{ steps.repo_case.outputs.repo }}:${{ github.sha }}
      - name: Update GitOps repository
        shell: bash
        env:
          GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          # Configure git credential store
          git config --global credential.helper store
          echo "https://${GIT_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials
          
          # Remove any existing gitops directory
          rm -rf gitops
          
          # Clone repository using HTTPS URL without token
          git clone https://github.com/IlCodeLover/grade-api-gitops.git gitops
          cd gitops

          echo "---> Before changing <------"
          cat deployment.yaml
               
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s|image: ghcr.io/${{ github.repository }}:.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|g" deployment.yaml
          else
            sed -i "s|image: ghcr.io/${{ github.repository }}:.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|g" deployment.yaml
          fi

#          updated the string-replacement command inside your GitOps script to use ${LOWER_REPO} instead of ${{ github.repository }}
#          if [[ "$OSTYPE" == "darwin"* ]]; then
#            sed -i '' "s|image: ghcr.io/${LOWER_REPO}:.*|image: ghcr.io/${LOWER_REPO}:${{ github.sha }}|g" deployment.yaml
#          else
#            sed -i "s|image: ghcr.io/${LOWER_REPO}:.*|image: ghcr.io/${LOWER_REPO}:${{ github.sha }}|g" deployment.yaml
#          fi

          echo "---> After updated the string-replacement command inside your GitOps script to use LOWER_REPO <------"
          cat deployment.yaml
          
          # Commit changes
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Update image to ${{ github.sha }}"
          
          # Push
          git push -f https://${GIT_TOKEN}@github.com/IlCodeLover/grade-api-gitops.git main
